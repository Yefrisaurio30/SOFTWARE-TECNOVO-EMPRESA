services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tecnovo
      POSTGRES_PASSWORD: tecnovo
      POSTGRES_DB: tecnovo
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://tecnovo:tecnovo@db:5432/tecnovo?schema=public

volumes:
  pgdata:
